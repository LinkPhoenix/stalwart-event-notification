services:
  db:
    image: postgres:17-alpine
    container_name: stalwart_event_notification_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stalwart_event_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stalwart_event_notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stalwart_event_notification_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/stalwart_event_notification?sslmode=disable

volumes:
  postgres_data:

